<header class="border-b border-gray-200 bg-white">
  <div class="flex flex-wrap items-end justify-between gap-5 px-6 pt-6">
    <div class="pb-5">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-gray-900 text-white">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-950">SQE English Lab</h1>
          <p class="mt-0.5 text-xs text-gray-500">供应商质量工程英语训练</p>
        </div>
      </div>
    </div>

    <nav class="flex items-center gap-6" aria-label="English Lab">
      <a href="{{ url_for('drill.index') }}"
         class="border-b-2 px-1 pb-5 text-sm font-semibold transition
                {% if request.endpoint == 'drill.index' %}border-gray-900 text-gray-950{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
        今日练习
      </a>
      <a href="{{ url_for('drill.scenarios') }}"
         class="border-b-2 px-1 pb-5 text-sm font-semibold transition
                {% if request.endpoint == 'drill.scenarios' %}border-gray-900 text-gray-950{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
        工作场景
      </a>
      <a href="{{ url_for('drill.materials') }}"
         class="border-b-2 px-1 pb-5 text-sm font-semibold transition
                {% if request.endpoint and request.endpoint.startswith('drill.material') %}border-gray-900 text-gray-950{% else %}border-transparent text-gray-500 hover:text-gray-900{% endif %}">
        素材库
      </a>
    </nav>
  </div>
</header>
